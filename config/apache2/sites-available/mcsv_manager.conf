<Location "/api/mcsv_manager/">
    ProxyPreserveHost On

    # The manager checks a signed token (Authorization: Bearer, or the console
    # WebSocket's subprotocol) on every request. Apache auth here would fight
    # it over the Authorization header, and nothing may arrive claiming to be
    # an Apache-authenticated user.
    AuthType None
    Require all granted
    RequestHeader unset X-Remote-User

    ProxyPass        unix:/run/mcsv_manager.sock|http://a/ upgrade=websocket
    ProxyPassReverse http://a/
</Location>
